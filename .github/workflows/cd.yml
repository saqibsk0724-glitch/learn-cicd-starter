
name: cd

on:
  push:
    branches: [main]

jobs:
  Deploy:
    name: Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: Build production binary
        run: ./scripts/buildprod.sh

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/865942619312/locations/global/workloadIdentityPools/github/providers/my-repo
          service_account: cloud-run-deployer@able-handbook-513814-v8.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: able-handbook-513814-v8

      - name: Build and push Docker image
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/able-handbook-513814-v8/notely-ar-repo/notely:latest .

      - name: Deploy to Cloud Run
        run: gcloud run deploy notely --image us-central1-docker.pkg.dev/able-handbook-513814-v8/notely-ar-repo/notely:latest --region us-central1 --allow-unauthenticated --project able-handbook-513814-v8 --max-instances=4